# Runs the plugin test suite on branches and pull requests.
# Pushes to main are covered by the test step in deploy.yaml, which gates the
# Pages deploy, so this deliberately skips main to avoid running twice.
name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
